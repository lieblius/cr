[project]
name = "cr"
version = "0.1.0"
description = "Resume the most recent Claude Code session for the current git branch"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cr = "cr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cr"]
